{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verify Voucher — EARTHA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'web/css/app.css' %}">
</head>
<body class="lock-viewport">
  {% csrf_token %}

  <header class="app-header" id="appHeader"></header>

  <div class="auth-page">
    <div class="auth-visual" role="img" aria-label="Two figures in linen, arms linked"></div>

    <div class="auth-panel">
      <h1 style="margin-top:0;">VOUCHER CHECK</h1>
      <p class="form-msg" id="verifyMsg" role="status">CHECKING VOUCHER&hellip;</p>

      <div id="verifyDetails" hidden>
        <p style="font-size:18px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;margin-bottom:4px;" id="verifyBrand"></p>
        <p class="muted" id="verifyDiscount"></p>
        <p class="badge" id="verifyStatusBadge" style="margin-top:12px;"></p>
        <p class="muted" id="verifyRedeemedAt" style="font-size:11px;margin-top:8px;"></p>
      </div>

      <button class="btn btn-block" id="verifyRedeemBtn" style="margin-top:20px;" hidden>
        STORE STAFF — TAP TO CONFIRM REDEMPTION
      </button>
    </div>
  </div>

  <script src="{% static 'web/js/store.js' %}"></script>
  <script nonce="{{ request.csp_nonce }}">Eartha.renderHeader(Eartha.currentUser(), 'verify');</script>
  <script src="{% static 'web/js/verify.js' %}"></script>
</body>
</html>

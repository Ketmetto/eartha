{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="{% static 'web/images/favicon.svg' %}" type="image/svg+xml">
  <title>Reset Password — EARTHA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'web/css/app.css' %}">
</head>
<body class="lock-viewport">

  <header class="app-header" id="appHeader"></header>

  <div class="auth-page">
    <div class="auth-visual" role="img" aria-label="Two figures in linen, arms linked"></div>

    <div class="auth-panel">
      <h1 style="margin-top:0;">RESET PASSWORD</h1>
      <form id="resetForm" novalidate>
        <div class="field">
          <label for="newPassword">NEW PASSWORD</label>
          <input type="password" id="newPassword" autocomplete="new-password" required>
          <p class="hint">MINIMUM 8 CHARACTERS</p>
        </div>
        <div class="field">
          <label for="newPassword2">CONFIRM NEW PASSWORD</label>
          <input type="password" id="newPassword2" autocomplete="new-password" required>
        </div>
        <button type="submit" class="btn btn-block">RESET PASSWORD</button>
        <p class="form-msg" id="resetMsg" role="status"></p>
      </form>
      <a href="/login/" class="btn btn-block btn-ghost" id="resetLoginLink" hidden style="margin-top:12px;">GO TO SIGN IN</a>
    </div>
  </div>

  <script src="{% static 'web/js/store.js' %}"></script>
  <script>Eartha.renderHeader(Eartha.currentUser(), 'reset-password');</script>
  <script src="{% static 'web/js/reset-password.js' %}"></script>
</body>
</html>

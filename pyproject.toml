[project]
name = "eartha"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "django>=5.0,<5.1",
    "djangorestframework>=3.15",
    "djangorestframework-simplejwt>=5.3",
    "django-allauth>=0.63",
    "dj-rest-auth>=6.0",
    "requests>=2.32",
    "cryptography>=42",
    "Pillow>=10.4",
    "psycopg[binary]>=3.1",
    "celery>=5.4",
    "redis>=5.0",
    "django-storages[s3]>=1.14",
    "django-cors-headers>=4.4",
    "python-decouple>=3.8",
    "firebase-admin>=6.5",
    "whitenoise>=6.7",
    "django-unfold>=0.38",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-django>=4.8",
    "factory-boy>=3.3",
    "django-debug-toolbar>=4.4",
    "ruff>=0.5",
]
prod = [
    "gunicorn>=22.0",
    "sentry-sdk>=2.10",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["apps*", "base*", "config*", "notifications*"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"  # local/CI test runs use sqlite; dev/staging/prod use Postgres
python_files = ["tests.py", "test_*.py", "*_tests.py"]
# --ds is a belt-and-suspenders duplicate of DJANGO_SETTINGS_MODULE above:
# pytest-django prioritizes the DJANGO_SETTINGS_MODULE *env var* over this
# ini option, and the dev container sets that env var to config.settings.dev
# for the runserver process — without --ds here, `pytest` would silently run
# against real Postgres/Redis instead of the fast sqlite/locmem test settings.
addopts = "--tb=short --strict-markers --ds=config.settings.test"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
]

# Managed Lite / Pro tier deployment. Use with:
# docker compose -f docker-compose.prod.yml up -d
#
# Resource limits below are sized for Hostinger KVM1 (4 GB RAM total).
# See "Resource limits (KVM1)" in DEPLOYMENT.md for the budget breakdown.

services:
  web:
    build:
      context: .
      args:
        INSTALL_EXTRA: prod
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3
    env_file: .env.prod
    volumes:
      - static_data:/app/staticfiles
      - media_data:/app/media
      - ./secrets/firebase-adminsdk.json:/app/secrets/firebase-adminsdk.json:ro
    environment:
      - GOOGLE_APPLICATION_CREDENTIALS=/app/secrets/firebase-adminsdk.json
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1G
    restart: unless-stopped

  celery:
    build:
      context: .
      args:
        INSTALL_EXTRA: prod
    command: celery -A config worker -l info --concurrency=2
    env_file: .env.prod
    volumes:
      - media_data:/app/media
      - ./secrets/firebase-adminsdk.json:/app/secrets/firebase-adminsdk.json:ro
    environment:
      - GOOGLE_APPLICATION_CREDENTIALS=/app/secrets/firebase-adminsdk.json
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 300M
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    command: postgres -c shared_buffers=256MB -c max_connections=50
    env_file: .env.prod
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12
    deploy:
      resources:
        limits:
          memory: 512M
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    deploy:
      resources:
        limits:
          memory: 150M
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_data:/app/staticfiles:ro
      - media_data:/app/media:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_certs:/etc/letsencrypt:ro
      # Remove the two lines below once real certbot certs are live —
      # self-signed cert was for local HTTPS testing only, not for prod.
      - ./selfsigned.crt:/etc/ssl/selfsigned.crt:ro
      - ./selfsigned.key:/etc/ssl/selfsigned.key:ro     #TEMP TEST
    depends_on:
      - web
    restart: unless-stopped

  certbot:
    image: certbot/certbot
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_certs:/etc/letsencrypt
    entrypoint: >
      sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot; sleep 12h & wait $${!}; done'
    restart: unless-stopped

volumes:
  postgres_data:
  media_data:
  static_data:
  certbot_www:
  certbot_certs:

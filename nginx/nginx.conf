# Edge-level flood protection on top of Django/DRF's per-endpoint
# throttles — those still cost a full gunicorn worker per request before
# rejecting it, so a flood can exhaust all 3 workers regardless. Declared
# here since this file loads inside nginx's http{} block; applied below.
limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

# --- HTTP (port 80) ---
server {
    listen 80;
    server_name localhost eartha.me www.eartha.me;
    server_tokens off;

    # Certbot needs this path reachable over plain HTTP
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect everything else to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS (port 443) ---
server {
    listen 443 ssl;
    http2 on;
    server_name localhost eartha.me www.eartha.me;
    server_tokens off;

    # TEMP: self-signed for local testing
#    ssl_certificate     /etc/ssl/selfsigned.crt;
#    ssl_certificate_key /etc/ssl/selfsigned.key;

    # PROD: swap these in after Certbot runs
    ssl_certificate     /etc/letsencrypt/live/eartha.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/eartha.me/privkey.pem;

    client_max_body_size 20M;

    # Applied server-wide, not per-location — a flood against /static/ or
    # /media/ ties up the same worker/connection budget as one against the
    # app itself. burst=20 absorbs a real page load's normal handful of
    # near-simultaneous requests (HTML + CSS + JS + a few images) without
    # tripping on legitimate traffic; nodelay serves the burst immediately
    # instead of queueing it, so real users never feel this.
    limit_req zone=general burst=20 nodelay;
    limit_conn conn_limit 20;

    location /static/ {
        alias /app/staticfiles/;
        add_header X-Content-Type-Options nosniff;
    }

    location /media/ {
        alias /app/media/;
        # User-uploaded content served with no auth check — Django's own
        # SECURE_CONTENT_TYPE_NOSNIFF never reaches responses nginx serves
        # directly like this one. Complements base.validators' upload-time
        # image verification as a second layer.
        add_header X-Content-Type-Options nosniff;
    }

    location / {
        # A bare `proxy_pass http://web:8000` resolves once at config load
        # and caches that IP, so a redeployed `web` container (new IP)
        # gets 502s until nginx restarts. Routing through a variable
        # forces re-resolution via Docker's DNS on every `valid` window.
        resolver 127.0.0.11 valid=10s;
        set $upstream_web http://web:8000;
        proxy_pass $upstream_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

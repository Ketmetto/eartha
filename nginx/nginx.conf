# Rate/connection limiting zones — declared once here (this file is
# included inside nginx's http{} block by the base image), applied per
# server below. This is edge-level flood protection, separate from and in
# addition to Django/DRF's per-endpoint throttle scopes (login, register,
# contact, etc.) — those are business-logic-aware (per-user, per-action)
# but every request still costs a full gunicorn worker + Python request
# cycle before Django can reject it. With only 3 gunicorn workers (see
# docker-compose.prod.yml), a flood of requests that are *all* going to
# get 429'd can still exhaust every worker and starve real traffic before
# any of them reach that check. Rejecting excess requests here instead
# costs nginx almost nothing, and doesn't depend on Django's throttling
# being configured correctly (the X-Forwarded-For issue fixed in
# config/settings/prod.py is exactly the kind of app-layer bug this adds
# a second, independent layer against).
limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

# --- HTTP (port 80) ---
server {
    listen 80;
    server_name localhost YOURDOMAIN.com www.YOURDOMAIN.com;
    server_tokens off;

    # Certbot needs this path reachable over plain HTTP
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect everything else to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS (port 443) ---
server {
    listen 443 ssl;
    http2 on;
    server_name localhost YOURDOMAIN.com www.YOURDOMAIN.com;
    server_tokens off;

    # TEMP: self-signed for local testing
    ssl_certificate     /etc/ssl/selfsigned.crt;
    ssl_certificate_key /etc/ssl/selfsigned.key;

    # PROD: swap these in after Certbot runs
    # ssl_certificate     /etc/letsencrypt/live/YOURDOMAIN.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/YOURDOMAIN.com/privkey.pem;

    client_max_body_size 20M;

    # Applied server-wide, not per-location — a flood against /static/ or
    # /media/ ties up the same worker/connection budget as one against the
    # app itself. burst=20 absorbs a real page load's normal handful of
    # near-simultaneous requests (HTML + CSS + JS + a few images) without
    # tripping on legitimate traffic; nodelay serves the burst immediately
    # instead of queueing it, so real users never feel this.
    limit_req zone=general burst=20 nodelay;
    limit_conn conn_limit 20;

    location /static/ {
        alias /app/staticfiles/;
        add_header X-Content-Type-Options nosniff;
    }

    location /media/ {
        alias /app/media/;
        # User-uploaded content, served with no auth check, straight from
        # disk — Django's own SECURE_CONTENT_TYPE_NOSNIFF (config/settings/
        # prod.py) never touches responses nginx serves directly like this
        # one. Complements the upload-time image verification in
        # base.validators: nosniff stops a browser from executing a file
        # as anything other than the Content-Type nginx declares for it.
        add_header X-Content-Type-Options nosniff;
    }

    location / {
        # A bare `proxy_pass http://web:8000` resolves the `web` hostname
        # once, at config load, and caches that IP for the life of the
        # worker process. When `web` gets recreated (a redeploy) it gets a
        # new IP, but nginx keeps sending traffic to the old one until
        # restarted — a 502 that only shows up on the next deploy. Routing
        # through a variable forces nginx to re-resolve via Docker's
        # embedded DNS (127.0.0.11) on every `valid` window instead of once,
        # so a redeployed `web` container is picked up automatically.
        resolver 127.0.0.11 valid=10s;
        set $upstream_web http://web:8000;
        proxy_pass $upstream_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

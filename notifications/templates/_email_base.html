<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}Eartha{% endblock %}</title>
<style>
  body { margin: 0; padding: 0; background: #EAE2D0; font-family: "Courier New", Courier, monospace; color: #1B1815; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 32px 16px; }
  .header { background: #404139; padding: 22px 32px; }
  .header .wordmark { color: #F2EBDC; font-size: 18px; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase; margin: 0; }
  .card { background: #F5F0E5; padding: 40px 32px; }
  h1 { font-size: 20px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; margin: 0 0 20px; color: #1B1815; }
  p { line-height: 1.6; font-size: 14px; margin: 0 0 16px; }
  .muted { color: #55503F; font-size: 12px; }
  .btn {
    display: inline-block;
    background: #404139;
    color: #F2EBDC !important;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    text-decoration: none;
    padding: 14px 30px;
    border: 1px solid #404139;
    margin: 8px 0 20px;
  }
  .url-fallback { word-break: break-all; color: #55503F; font-size: 12px; }
  .badge {
    display: inline-block;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 5px 12px;
    background: #404139;
    color: #F2EBDC;
  }
  .points-num { font-size: 34px; font-weight: 700; color: #4A5D3A; margin: 0 0 8px; }
  .footer { padding: 24px 32px 4px; text-align: center; }
  .footer p { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: #55503F; margin: 0; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="header">
      <p class="wordmark">EARTHA</p>
    </div>
    <div class="card">
      {% block content %}{% endblock %}
    </div>
    <div class="footer">
      <p>Eartha Collection / Circular Fashion &mdash; Est. 2026</p>
    </div>
  </div>
</body>
</html>

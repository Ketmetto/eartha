<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Points awarded</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; line-height: 1.6; color: #333; max-width: 600px; margin: 0 auto; padding: 40px 20px; }
        .points { font-size: 32px; font-weight: 700; color: #2563eb; }
        .footer { margin-top: 40px; font-size: 13px; color: #6b7280; }
    </style>
</head>
<body>
    <h2>You just earned points</h2>
    <p>Hi {{ first_name|default:email }},</p>
    <p class="points">+{{ points }} points</p>
    <p>Your item ({{ category }}, {{ condition }} condition) was accepted.</p>
    <p>Your new balance is <strong>{{ balance }} points</strong>. Log in to see what you can redeem them for.</p>
    <div class="footer">
        <p>This is an automated message from Eartha.</p>
    </div>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Submission update</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; line-height: 1.6; color: #333; max-width: 600px; margin: 0 auto; padding: 40px 20px; }
        .status { display: inline-block; padding: 4px 12px; border-radius: 6px; background: #eef2ff; color: #2563eb; font-weight: 600; }
        .footer { margin-top: 40px; font-size: 13px; color: #6b7280; }
    </style>
</head>
<body>
    <h2>Your submission was updated</h2>
    <p>Hi {{ first_name|default:email }},</p>
    <p>Your submission ({{ category }}, submitted {{ created_at }}) is now: <span class="status">{{ status_label }}</span></p>
    {% if rejection_reason %}
    <p><strong>Reason:</strong> {{ rejection_reason }}</p>
    {% endif %}
    <p>Log in to view details.</p>
    <div class="footer">
        <p>This is an automated message from Eartha.</p>
    </div>
</body>
</html>
